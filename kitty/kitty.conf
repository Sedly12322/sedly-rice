# Sedly-Rice Kitty Configuration

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Shell
shell zsh

# Opacity and blur
background_opacity 0.88
background_blur 1

# Padding
window_padding_width 10

# Disable audio bell
enable_audio_bell no

# Cursor
cursor_shape beam
cursor_blink_interval 0.5

# Include Matugen generated colors
include matugen-colors.conf
