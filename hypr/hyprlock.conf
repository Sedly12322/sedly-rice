source = ~/.config/hypr/hyprlock/colors.conf

general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
    color = rgba(19, 19, 24, 1.0)
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.25
    dots_center = true
    outer_color = $entry_border_color
    inner_color = $entry_background_color
    font_color = $entry_color
    fade_on_empty = false
    placeholder_text = <span font_family="Google Sans Flex">󰌾 Heslo...</span>
    hide_input = false
    rounding = 25
    check_color = rgba(90b490ff)
    fail_color = rgba(e06c75ff)
    fail_text = <i>Špatné heslo ($ATTEMPTS)</i>
    capslock_color = rgba(e5c07bff)
    position = 0, -40
    halign = center
    valign = center
}

# Clock (Hour:Minute)
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $text_color
    font_size = 84
    font_family = $font_family_clock
    position = 0, 160
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] LC_TIME=cs_CZ.UTF-8 date +"%A, %-d. %B %Y"
    color = $text_color
    font_size = 18
    font_family = $font_family
    position = 0, 75
    halign = center
    valign = center
}

# User greeting
label {
    monitor =
    text = cmd[update:60000] echo "Přihlášen jako $USER"
    color = $text_color
    font_size = 14
    font_family = $font_family
    position = 0, 25
    halign = center
    valign = center
}

# Keyboard layout
label {
    monitor =
    text = $LAYOUT
    color = $text_color
    font_size = 12
    font_family = $font_family
    position = -30, 30
    halign = right
    valign = bottom
}
