# Sedly-Rice Starship Prompt (Dynamic Matugen)

format = """
[╭─](bold #9acbfa)$directory$git_branch$git_status$character
[╰─](bold #9acbfa) """

right_format = """$cmd_duration$time"""

continuation_prompt = '[▶▶ ](bold #9acbfa)'

[directory]
style = "bold #9acbfa"
format = "[$path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
style = "bold #d2bfe7"
format = "on [$symbol$branch ]($style)"
symbol = "󰊢 "

[git_status]
style = "bold #ffb4ab"
format = "([$all_status$ahead_behind]($style) )"

[character]
success_symbol = "[❯](bold #9acbfa)"
error_symbol = "[❯](bold #ffb4ab)"

[time]
disabled = false
style = "bold #8c9198"
format = "[$time]($style)"
time_format = "%T"

[cmd_duration]
style = "bold #b9c8da"
format = "took [$duration]($style) "
min_time = 2_000