# Sedly-Rice Starship Prompt (Dynamic Matugen)

format = """
[╭─](bold #ffb598)$directory$git_branch$git_status$character
[╰─](bold #ffb598) """

right_format = """$cmd_duration$time"""

continuation_prompt = '[▶▶ ](bold #ffb598)'

[directory]
style = "bold #ffb598"
format = "[$path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
style = "bold #d4c78e"
format = "on [$symbol$branch ]($style)"
symbol = "󰊢 "

[git_status]
style = "bold #ffb4ab"
format = "([$all_status$ahead_behind]($style) )"

[character]
success_symbol = "[❯](bold #ffb598)"
error_symbol = "[❯](bold #ffb4ab)"

[time]
disabled = false
style = "bold #a08d86"
format = "[$time]($style)"
time_format = "%T"

[cmd_duration]
style = "bold #e7beae"
format = "took [$duration]($style) "
min_time = 2_000