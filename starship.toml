# Sedly-Rice Starship Prompt (Dynamic Matugen)

format = """
[╭─](bold #84d2e6)$directory$git_branch$git_status$character
[╰─](bold #84d2e6) """

right_format = """$cmd_duration$time"""

continuation_prompt = '[▶▶ ](bold #84d2e6)'

[directory]
style = "bold #84d2e6"
format = "[$path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
style = "bold #bec5eb"
format = "on [$symbol$branch ]($style)"
symbol = "󰊢 "

[git_status]
style = "bold #ffb4ab"
format = "([$all_status$ahead_behind]($style) )"

[character]
success_symbol = "[❯](bold #84d2e6)"
error_symbol = "[❯](bold #ffb4ab)"

[time]
disabled = false
style = "bold #899295"
format = "[$time]($style)"
time_format = "%T"

[cmd_duration]
style = "bold #b2cbd2"
format = "took [$duration]($style) "
min_time = 2_000