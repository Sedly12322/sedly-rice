# Sedly-Rice Starship Prompt (Dynamic Matugen)

format = """
[╭─](bold #ddb9f8)$directory$git_branch$git_status$character
[╰─](bold #ddb9f8) """

right_format = """$cmd_duration$time"""

continuation_prompt = '[▶▶ ](bold #ddb9f8)'

[directory]
style = "bold #ddb9f8"
format = "[$path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
style = "bold #f3b7bc"
format = "on [$symbol$branch ]($style)"
symbol = "󰊢 "

[git_status]
style = "bold #ffb4ab"
format = "([$all_status$ahead_behind]($style) )"

[character]
success_symbol = "[❯](bold #ddb9f8)"
error_symbol = "[❯](bold #ffb4ab)"

[time]
disabled = false
style = "bold #968e98"
format = "[$time]($style)"
time_format = "%T"

[cmd_duration]
style = "bold #d1c1d9"
format = "took [$duration]($style) "
min_time = 2_000